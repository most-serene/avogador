services:
  apigateway:
    image: "avogador-apigateway:dev-latest"
    restart: always
    build:
      context: ./backend/apigateway
      network: host
      dockerfile: Dockerfile
      target: ${APIGATEWAY_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    environment:
      sentry.dsn: ${BACKEND_GLITCHTIP_DSN}
      # spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      # spring.rabbitmq.username: ${RABBITMQ_USERNAME}
      # spring.rabbitmq.password: ${RABBITMQ_PASSWORD}
      server.port: 80
      # logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: ${SPRING_LOGGING_LEVEL}
      logging.level.org.springframework.cloud.gateway: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      server.error.include-message: always
      # jwt.secret: ${JWT_SECRET}
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      spring.servlet.multipart.max-file-size: 2GB
      spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${APIGATEWAY_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      security.allowed.origins: ${APIGATEWAY_ALLOWED_ORIGINS}
      # multipart.enabled: false
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
    ports:
      - "${APIGATEWAY_PORT}:80"
      - "${APIGATEWAY_PORT_DEBUGGER}:5005"
    networks:
      - avogador-inner-network

  users:
    image: "avogador-userservice:dev-latest" 
    restart: always
    build:
      context: ./backend/services/userservice
      network: host
      dockerfile: Dockerfile
      target: ${USERSERVICE_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      sentry.dsn: ${BACKEND_GLITCHTIP_DSN}
      # spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      # spring.rabbitmq.username: ${RABBITMQ_USERNAME}
      # spring.rabbitmq.password: ${RABBITMQ_PASSWORD}
      server.port: 80
      spring.datasource.url: ${USERSERVICE_DATASOURCE_URL}
      spring.datasource.username: ${USERSERVICE_DATASOURCE_USERNAME}
      spring.datasource.password: ${USERSERVICE_DATASOURCE_PASSWORD}
      spring.jpa.hibernate.ddl-auto: ${USERSERVICE_JPA_HIBERNATE_DDL_AUTO}
      spring.jpa.properties.hibernate.dialect: ${USERSERVICE_JPA_PROPERTIES_HIBERNATE_DIALECT}
      logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      server.error.include-message: always
      jwt.secret: ${JWT_SECRET}
      customer.domains: ${CUSTOMER_DOMAINS}
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      # spring.servlet.multipart.max-file-size: 2GB
      # spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${USERSERVICE_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      security.allowed.origins: ${USERSERVICE_ALLOWED_ORIGINS}
      # multipart.enabled: false
      spring.mail.host: ${MAIL_HOST}
      spring.mail.username: ${MAIL_USER} 
      spring.mail.password: ${MAIL_PASSWORD} 
      spring.mail.properties.mail.transport.protocol: smtp
      spring.mail.properties.mail.smtp.port: 587
      spring.mail.properties.mail.smtp.auth: true
      spring.mail.properties.mail.smtp.starttls.enable: true
      spring.mail.properties.mail.smtp.starttls.required: true
      spring.mail.properties.mail.debug: false
      spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      spring.rabbitmq.username: ${USERSERVICE_RABBITMQ_USERNAME}
      spring.rabbitmq.password: ${USERSERVICE_RABBITMQ_PASSWORD}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
    ports:
      - "${USERSERVICE_PORT}:80"
      - "${USERSERVICE_PORT_DEBUGGER}:5005"
    networks:
      - avogador-inner-network

  courses:
