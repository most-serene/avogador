  storage:
    image: "avogador-storageservice:dev-latest" 
    restart: always
    build:
      context: ./backend/services/storageservice
      network: host
      dockerfile: Dockerfile
      target: ${STORAGESERVICE_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      sentry.dsn: ${BACKEND_GLITCHTIP_DSN}
      spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      spring.rabbitmq.username: ${STORAGESERVICE_RABBITMQ_USERNAME}
      spring.rabbitmq.password: ${STORAGESERVICE_RABBITMQ_PASSWORD}
      server.port: 80
      logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      server.error.include-message: always
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      spring.servlet.multipart.max-file-size: 2GB
      spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${STORAGESERVICE_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      # multipart.enabled: false
      fs.root: /avogador
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
    ports:
      - "${STORAGESERVICE_PORT}:80"
      - "${STORAGESERVICE_PORT_DEBUGGER}:5005"
    volumes:
      - filesystem-volume:/avogador
    networks:
      - avogador-inner-network

  executor:
    image: "avogador-executorservice:dev-latest" 
    restart: always
    build:
      context: ./backend/services/executorservice
      network: host
      dockerfile: Dockerfile
      target: ${EXECUTORSERVICE_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      sentry.dsn: ${BACKEND_GLITCHTIP_DSN}
      spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      spring.rabbitmq.username: ${EXECUTORSERVICE_RABBITMQ_USERNAME}
      spring.rabbitmq.password: ${EXECUTORSERVICE_RABBITMQ_PASSWORD}
      server.port: 80
      logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      server.error.include-message: always
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      # spring.servlet.multipart.max-file-size: 2GB
      # spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${EXECUTORSERVICE_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      # multipart.enabled: false
      executor.docker.host: ${EXECUTORSERVICE_DOCKER_HOST}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
    ports:
      - "${EXECUTORSERVICE_PORT}:80"
      - "${EXECUTORSERVICE_PORT_DEBUGGER}:5005"
    networks:
      - avogador-inner-network

  rabbitmq:
    hostname: avogador-rabbitmq
    image: rabbitmq:3-management
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 15s
      retries: 3
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    networks:
      - avogador-inner-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    ports:
      # - "5672:5672"
      - "15672:15672"

volumes:
  rabbitmq-data:
  
  filesystem-volume:
    driver: local
    driver_opts:
      type: cifs    
      device: //${STORAGESERVICE_VOLUME_ADDRESS}/${STORAGESERVICE_VOLUME_NAME}
      o: "addr=${STORAGESERVICE_VOLUME_ADDRESS},username=${STORAGESERVICE_VOLUME_USER},password=${STORAGESERVICE_VOLUME_PASS},file_mode=0777,dir_mode=0777"

networks:
  avogador-inner-network:
