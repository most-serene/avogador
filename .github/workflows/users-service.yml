name: User Microservice CICD pipeline
run-name: PR User Microservice pipeline for ${{ github.ref }}
on:
  workflow_dispatch:
  pull_request:
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          
      - name: Set up WireGuard
        uses: egor-tensin/setup-wireguard@v1
        with:
          endpoint: '${{ secrets.ENDPOINT }}'
          endpoint_public_key: '${{ secrets.ENDPOINT_PUBLIC }}'
          ips: '${{ secrets.IPS }}'
          allowed_ips: '${{ secrets.ALLOWED_IPS }}'
          private_key: '${{ secrets.PRIVATE }}'
        
      - name: testing vpn link
        run: |
          ping -c 1 dev-server.sanve.mostserene.eu
    
      - name: Gradle build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assemble
          build-root-directory: backend/services/userservice
      
      - uses: actions/upload-artifact@v3
        with:
          name: usersService.jar
          path: backend/services/userservice/build/libs/*.jar
  
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Download application.properties
        run: curl -k https://repository.mostserene.eu/avogador/envs/testing/users/application.properties -u ${{ secrets.REPOSITORY_CREDENTIALS }}  --output backend/services/userservice/src/test/resources/application.properties

      - name: Gradle test
        uses: gradle/gradle-build-action@v2
        with:
          arguments: test
          build-root-directory: backend/services/userservice
      
      - uses: actions/upload-artifact@v3
        with:
          name: userserviceTests
          path: backend/services/userservice/build/test-results/
