name: Jenkins
run-name: Jenkins Triggered by ${{ github.actor }}
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  Trigger-Jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: set jenkins pending
        run: |
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.JENKINS_GITHUB_TOKEN }}" \
          https://api.github.com/repos/most-serene/avogador/statuses/${{ github.sha }} \
          -d '{"state":"pending","target_url":"https://jenkins.mostserene.eu/blue/organizations/jenkins/avogador/activity","description":"The Jenkins build will start ASAP","context":"continuous-integration/jenkins/branch "}'

      - name: Set up WireGuard
        uses: egor-tensin/setup-wireguard@v1
        with:
          endpoint: '${{ secrets.ENDPOINT }}'
          endpoint_public_key: '${{ secrets.ENDPOINT_PUBLIC }}'
          ips: '${{ secrets.IPS }}'
          allowed_ips: '${{ secrets.ALLOWED_IPS }}'
          private_key: '${{ secrets.PRIVATE }}'
        
      - name: testing vpn link
        run: |
          ping -c 1 dev-server.sanve.mostserene.eu
    
      - name: Trigger jenkins job
        run: |
          curl -X POST --insecure -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" https://jenkins.mostserene.eu/job/avogador/build?token=github-action
