version: "3.8"

services:
  apigateway:
    image: "avogador-apigateway:${BRANCH:-latest}" 
    restart: always
    build:
      context: ./backend/apigateway
      network: host
      dockerfile: Dockerfile
      target: ${APIGATEWAY_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    environment:
      # spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      # spring.rabbitmq.username: ${RABBITMQ_USERNAME}
      # spring.rabbitmq.password: ${RABBITMQ_PASSWORD}
      server.port: 80
      # logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: ${SPRING_LOGGING_LEVEL}
      logging.level.org.springframework.cloud.gateway: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      # jwt.secret: ${JWT_SECRET}
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      # spring.servlet.multipart.max-file-size: 2GB
      # spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${APIGATEWAY_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      security.allowed.origins: ${APIGATEWAY_ALLOWED_ORIGINS}
      # multipart.enabled: false
    ports:
      - "${APIGATEWAY_PORT}:80"
    networks:
      - avogador-inner-network

  users:
    image: "avogador-userservice:${BRANCH:-latest}" 
    restart: always
    build:
      context: ./backend/services/userservice
      dockerfile: Dockerfile
      target: ${USERSERVICE_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    environment:
      # spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      # spring.rabbitmq.username: ${RABBITMQ_USERNAME}
      # spring.rabbitmq.password: ${RABBITMQ_PASSWORD}
      server.port: 80
      spring.datasource.url: ${USERSERVICE_DATASOURCE_URL}
      spring.datasource.username: ${USERSERVICE_DATASOURCE_USERNAME}
      spring.datasource.password: ${USERSERVICE_DATASOURCE_PASSWORD}
      spring.jpa.hibernate.ddl-auto: ${USERSERVICE_JPA_HIBERNATE_DDL_AUTO}
      spring.jpa.properties.hibernate.dialect: ${USERSERVICE_JPA_PROPERTIES_HIBERNATE_DIALECT}
      logging.level.org.springframework.cloud.gateway: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      jwt.secret: ${JWT_SECRET}
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      # spring.servlet.multipart.max-file-size: 2GB
      # spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${USERSERVICE_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      # security.allowed.origins: ${USERSERVICE_ALLOWED_ORIGINS}
      # multipart.enabled: false
    networks:
      - avogador-inner-network

  courses:
    image: "avogador-courseservice:${BRANCH:-latest}" 
    restart: always
    build:
      context: ./backend/services/courseservice
      dockerfile: Dockerfile
      target: ${COURSESERVICE_TARGET}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    environment:
      # spring.rabbitmq.host: ${RABBITMQ_BROKER_HOST}
      # spring.rabbitmq.username: ${RABBITMQ_USERNAME}
      # spring.rabbitmq.password: ${RABBITMQ_PASSWORD}
      server.port: 80
      spring.datasource.url: ${COURSESERVICE_DATASOURCE_URL}
      spring.datasource.username: ${COURSESERVICE_DATASOURCE_USERNAME}
      spring.datasource.password: ${COURSESERVICE_DATASOURCE_PASSWORD}
      spring.jpa.hibernate.ddl-auto: ${COURSESERVICE_JPA_HIBERNATE_DDL_AUTO}
      spring.jpa.properties.hibernate.dialect: ${COURSESERVICE_JPA_PROPERTIES_HIBERNATE_DIALECT}
      logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: ${SPRING_LOGGING_LEVEL}
      spring.output.ansi.enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
      joinCode.secret: ${JOINCODE_SECRET}
      # jwt.secret: ${JWT_SECRET}
      # rabbit.hostname: ${RABBITMQ_BROKER_HOST}
      # spring.servlet.multipart.max-file-size: 2GB
      # spring.servlet.multipart.max-request-size: 2GB
      spring.profiles.active: ${COURSESERVICE_PROFILE}
      spring.lifecycle.timeout-per-shutdown-phase: 1m
      server.shutdown: graceful
      # security.allowed.origins: ${COURSESERVICE_ALLOWED_ORIGINS}
      # multipart.enabled: false
    networks:
      - avogador-inner-network

  webapp:
    image: avogador-webapp:${BRANCH:-latest}
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${REACT_TARGET}
      network: host
      args:
        VITE_AVOGADOR_BACKEND_API_ADDRESS: ${VITE_AVOGADOR_BACKEND_API_ADDRESS}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        OBFUSCATE_DIRECTIVE: ${OBFUSCATE_DIRECTIVE}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    ports:
      - "${REACT_PORT}:3000"

networks:
  avogador-inner-network: