version: "3.8"

services:
  users:
    image: "avogador-userservice:dev-${BRANCH:-latest}" 
    restart: always
    build:
      context: ./backend/services/userservice
      network: host
      dockerfile: Dockerfile
      target: run
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    environment:
      server.port: 8080
    ports:
      - "${USERSERVICE_PORT}:8080"
    networks:
      - avogador-inner-network
  
  webapp:
    image: avogador-webapp:${BRANCH:-latest}
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${REACT_TARGET}
      network: host
    environment:
      OBFUSCATE_DIRECTIVE: ${OBFUSCATE_DIRECTIVE}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    ports:
      - "${REACT_PORT}:3000"

networks:
  avogador-inner-network: