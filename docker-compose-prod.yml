version: "3.8"

services:
  usercourse:
    image: "avogador-usercourse:dev-${BRANCH:-latest}" 
    restart: always
    build:
      context: ./backend/services/usercourse/
      network: host
      dockerfile: Dockerfile
      target: run
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    #environment:
    #  server.port: 8080
    ports:
      - "${PROJECTS_PORT}:8080"
    networks:
      - avogador-inner-network
      
  webapp:
    image: avogador-webapp:${BRANCH:-latest}
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${REACT_TARGET}
      network: host
    environment:
      OBFUSCATE_DIRECTIVE: ${OBFUSCATE_DIRECTIVE}
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: "5m"
    ports:
      - "${REACT_PORT}:3000"

networks:
  avogador-inner-network: